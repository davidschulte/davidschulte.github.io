{{ define "main" }}
<main>
    <section id="about">
        {{ .Content }}
    </section>
{{ with .Site.Data.news }}
<section class="news-section">
  <h2>News</h2>
  <div class="news">
    {{ range . }}
      <div class="news-item">
        <span class="news-date">{{ .date }}</span>
        <div class="news-text">{{ .text | safeHTML}}</div>
      </div>
    {{ end }}
  </div>
</section>
{{ end }}
</main>
{{ end }}
